# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets: []

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
#     adr: docs/architecture/adr-0000-performance-targets.md
#     added: 2026-03-26
#     revised: ""
#
#   - system: combat
#     status: active
#     budget_ms: 2.0
#     adr: docs/architecture/adr-0003-combat-system.md
#     notes: "Includes physics queries, hitbox evaluation, and damage calculation"
#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: time_source
    status: active
    api: "IFrameClock.now() — simulatedTime (seconds, float, accumulated delta)"
    not: "Date.now(), performance.now(), director.getTotalTime()"
    adr: docs/architecture/adr-0002-frameclock.md
    reason: "결정론적 재생 및 서버-클라이언트 타임스탬프 일치. 단위 테스트에서 tick() 수동 호출로 시간 제어 가능."
    referenced_by:
      - docs/architecture/adr-0002-frameclock.md
    added: 2026-04-21
    revised: ""

  - purpose: platform_sdk_access
    status: active
    api: "ITossBridge — DI로 주입된 인터페이스. getSafeArea(): SafeArea, getUserToken(): string"
    not: "@apps-in-toss/web-framework 직접 import (Foundation/Core/Feature/Presentation 레이어에서)"
    adr: docs/architecture/adr-0004-toss-bridge.md
    reason: "Platform SDK를 직접 import하면 레이어 경계 위반 및 단위 테스트 불가. StubTossBridge DI로 테스트 환경 분리."
    referenced_by:
      - docs/architecture/adr-0004-toss-bridge.md
    added: 2026-04-21
    revised: ""

  - purpose: websocket_client_access
    status: active
    api: "IWebSocketClient — DI로 주입된 인터페이스. connect(), disconnect(), send(), on(), off(), isConnected"
    not: "native WebSocket API 직접 사용, ws/socket.io 라이브러리 직접 import (게임 로직 레이어에서)"
    adr: docs/architecture/adr-0010-server-authority.md
    reason: "WebSocket 직접 의존은 단위 테스트 불가 및 서버 구현 교체 불가. MockWebSocketClient DI로 테스트 환경 분리 가능."
    referenced_by:
      - docs/architecture/adr-0010-server-authority.md
    added: 2026-04-21
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
